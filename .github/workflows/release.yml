name: release
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      branch: ${{ steps.branch.outputs.name }}
      create: ${{ steps.branch.outputs.open == 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Check for new NW.js release
        id: bump
        run: bash .github/bump

      - name: Check for open pull request
        id: branch
        if: steps.bump.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="patches/nw-${{ steps.bump.outputs.nw }}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          if gh pr list --head "$branch" --state open --json number --jq ".[0].number" | grep -q .; then
            echo "PR already open for $branch, skipping."
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check upstream tags exist
        if: steps.branch.outputs.open == 'false'
        run: |
          git ls-remote --exit-code --tags https://github.com/chromium/chromium "refs/tags/${{ steps.bump.outputs.chromium }}"
          git ls-remote --exit-code --tags https://github.com/nodejs/node "refs/tags/v${{ steps.bump.outputs.node }}"
          git ls-remote --exit-code --tags https://github.com/v8/v8 "refs/tags/${{ steps.bump.outputs.v8 }}"

      - name: Commit, push and open PR
        if: steps.branch.outputs.open == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          NW: ${{ steps.bump.outputs.nw }}
          CHROMIUM: ${{ steps.bump.outputs.chromium }}
          NODE: ${{ steps.bump.outputs.node }}
          V8: ${{ steps.bump.outputs.v8 }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add .github/patch README.md
          git commit -m "$NW"
          git push --force origin "$BRANCH"

          gh pr create \
            --title "Update patches for NW.js $NW" \
            --body "NW.js released [\`v$NW\`](https://nwjs.io/versions.json).

          - NW: $NW
          - Chromium: $CHROMIUM
          - Node: $NODE
          - V8: $V8

          Patches are generated and committed to this pull request by the \`patch\` job." \
            --base main \
            --head "$BRANCH"

  patch:
    needs: check
    if: needs.check.outputs.create == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Install Packages
        uses: ConorMacBride/install-package@v1.1.0
        with:
          apt: patchutils

      - name: Checkout pull request branch
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.check.outputs.branch }}

      - name: Make patches
        run: bash .github/patch

      - name: Commit patches
        run: |
          git add patches/*.patch
          if git diff --cached --quiet; then
            echo "Patches are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update NW.js patches"
          git push origin "HEAD:${{ needs.check.outputs.branch }}"
