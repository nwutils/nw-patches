name: patch
on:
  # TODO: Run patch job on pull_request
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Packages
        uses: ConorMacBride/install-package@v1.1.0
        with:
          apt: patchutils

      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Make patches
        # if: steps.cache-patches.outputs.cache-hit != 'true'
        run: |
          chmod 755 .github/patch
          bash .github/patch

      # TODO: Find way to uniquely label caches.
      # - name: Cache patches
      #   id: cache-patches
      #   uses: actions/cache@v3.3.2
      #   with:
      #     path: patches
      #     key: ${{ runner.os }}-patches

      - name: Commit patches
        run: |
          git add patches/*.patch
          if git diff --cached --quiet; then
            echo "Patches are up to date."
            exit 0
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git commit -m "Update NW.js patches"
          git push
